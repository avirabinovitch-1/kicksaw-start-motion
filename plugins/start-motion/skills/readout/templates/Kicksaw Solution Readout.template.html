<title>Kicksaw Solution Readout</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@500&display=swap">
<!--
  HOW THIS PAGE WORKS
  Everything in this readout is drawn from the data in the <script id="ro-data" type="application/json"> block at the bottom.
  The solution readout skill writes that data from the three discovery documents (the requirements list, the workflow
  document and the What we heard page) and the SC's judgment items, then rebuilds the page. Nobody edits the page by hand:
  a badly worded line is fixed in its source document and the readout is rebuilt.
  Workflows are copied from the workflow document's wf-data and drawn by the same renderer, so they look identical in both.
  Section numbers are fixed. A section left out keeps its number; the others do not move.
-->
<style>
/* Layout: one long printed-report column with a sticky section bar; the spine's six groups set the contents. Kicksaw Brand Playbook V2 tokens, shared with the workflow document and What we heard. */
:root{
  --navy:#03355E; --cyan:#44C8F5; --blue:#0071B9; --orange:#DD6443; --smoke:#EFEFEF; --charcoal:#414042; --white:#FFFFFF;
  --bg:#F6F7F8; --paper:#FFFFFF; --sunk:#EFF2F5; --line:#D9DEE3; --line-2:#E8ECF0;
  --ink:#1B2A36; --ink-2:#4B5A66; --ink-3:#76838E; --heading:#03355E; --thead:#03355E; --thead-ink:#FFFFFF;
  --accent:#0071B9; --accent-ink:#FFFFFF; --accent-soft:#E3F1FA; --warn:#C75A3C; --warn-bg:#FBEEE9; --warn-line:#EFC3B3;
  --ok:#2E7D4F; --ok-bg:#E6F3EB; --int:#6B4FA0; --int-bg:#F1EDF8; --int-line:#D6CBEA;
  --lane:#EFF2F5; --lane-2:#E6EAEE; --sys:#E9EDF1; --end:#03355E; --end-ink:#FFFFFF; --open:#C75A3C; --open-bg:#FBEEE9;
  --barbg:rgba(255,255,255,.94);
  --display:"Inter", Arial, sans-serif; --sans:"Source Sans 3", "Source Sans Pro", Arial, sans-serif; --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --shadow:0 1px 2px rgba(3,53,94,.05),0 10px 30px -14px rgba(3,53,94,.2);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E161D; --paper:#15202A; --sunk:#1B2731; --line:#2C3A46; --line-2:#22303B; --ink:#E6ECF1; --ink-2:#B3BEC8; --ink-3:#85929D;
  --heading:#D7E8F5; --thead:#163E63; --thead-ink:#EAF2FA; --accent:#5DB9F0; --accent-ink:#06202F; --accent-soft:#163142;
  --warn:#F0957A; --warn-bg:#34221B; --warn-line:#5A382C; --ok:#7CC79A; --ok-bg:#16301F; --int:#B9A3E6; --int-bg:#251D35; --int-line:#41355A;
  --lane:#19252F; --lane-2:#1E2B36; --sys:#243240; --end:#44C8F5; --end-ink:#03355E; --open:#F0957A; --open-bg:#34221B;
  --barbg:rgba(21,32,42,.94);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161D; --paper:#15202A; --sunk:#1B2731; --line:#2C3A46; --line-2:#22303B; --ink:#E6ECF1; --ink-2:#B3BEC8; --ink-3:#85929D;
  --heading:#D7E8F5; --thead:#163E63; --thead-ink:#EAF2FA; --accent:#5DB9F0; --accent-ink:#06202F; --accent-soft:#163142;
  --warn:#F0957A; --warn-bg:#34221B; --warn-line:#5A382C; --ok:#7CC79A; --ok-bg:#16301F; --int:#B9A3E6; --int-bg:#251D35; --int-line:#41355A;
  --lane:#19252F; --lane-2:#1E2B36; --sys:#243240; --end:#44C8F5; --end-ink:#03355E; --open:#F0957A; --open-bg:#34221B;
  --barbg:rgba(21,32,42,.94);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding-block:0 84px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4,p,ul,ol,figure{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.doc{max-width:1060px;margin:0 auto;background:var(--paper);border-radius:0 0 14px 14px;box-shadow:var(--shadow);padding:clamp(22px,5vw,56px) clamp(18px,6vw,64px) 40px}

/* sticky section bar */
.sbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px clamp(12px,3vw,20px);background:var(--barbg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.sbar .where{flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .where b{font:500 12px var(--mono);color:var(--accent)}
.sbar .where span{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.sbar button{font:600 13px var(--sans);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer}
.sbar button:hover{border-color:var(--ink-3)}
.sbar button:disabled{opacity:.35;cursor:default}
.sbar .nav{display:flex;gap:6px}
.panel{position:absolute;right:clamp(12px,3vw,20px);top:100%;margin-top:6px;width:min(420px,calc(100vw - 32px));max-height:min(70vh,560px);overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.panel h4{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:10px 0 4px}
.panel h4:first-child{margin-top:0}
.panel a{display:flex;gap:10px;padding:5px 6px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}
.panel a:hover{background:var(--sunk)}
.panel a span{font:500 12px var(--mono);color:var(--accent);min-width:22px;padding-top:2px}

/* cover */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.brand img{height:22px;width:auto;display:block}
.brand .dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .lt{display:none}:root:not([data-theme="light"]) .brand .dk{display:block}}
:root[data-theme="dark"] .brand .lt{display:none}:root[data-theme="dark"] .brand .dk{display:block}
.kind{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.cover{padding:34px 0 8px}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.eyebrow span{width:28px;height:3px;background:var(--accent);border-radius:2px;flex:none}
h1{font:700 clamp(28px,4.4vw,42px)/1.1 var(--display);color:var(--heading);margin-top:18px;letter-spacing:-.01em;text-wrap:balance}
h1 em{display:block;font-style:normal;color:var(--accent);font-size:.62em;margin-top:6px}
.sub{color:var(--ink-2);font-size:16.5px;max-width:64ch;margin-top:14px}
.meta{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;margin-top:26px}
.meta div{padding:14px 16px;min-width:0}.meta div+div{border-left:1px solid var(--line)}
.meta span{display:block;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.meta b{font-weight:600;font-size:14.5px;line-height:1.35;display:block}
.meta small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;font-weight:400}
@media(max-width:820px){.meta{grid-template-columns:1fr 1fr}.meta div+div{border-left:0}.meta div{border-top:1px solid var(--line)}.meta div:nth-child(-n+2){border-top:0}.meta div:nth-child(even){border-left:1px solid var(--line)}}
.status{display:inline-flex;align-items:center;gap:8px;margin-top:18px;font:600 13px var(--sans);border-radius:999px;padding:5px 13px;background:var(--accent-soft);color:var(--accent)}
.status.signed{background:var(--ok-bg);color:var(--ok)}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor}
.upd{margin-top:22px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:10px 14px}
.upd h4{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.upd ul{padding-left:18px;font-size:13.5px;color:var(--ink-2);display:grid;gap:3px}.upd li::marker{color:var(--accent)}
.toc{margin-top:28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 24px}
@media(max-width:760px){.toc{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.toc{grid-template-columns:1fr}}
.toc h4{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:6px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.toc a{display:flex;gap:10px;padding:3px 0;text-decoration:none;color:var(--ink);font-size:14.5px}
.toc a:hover{color:var(--accent)}
.toc a span{font:500 12px var(--mono);color:var(--accent);min-width:22px;padding-top:2px}
.howto{margin-top:26px;background:var(--sunk);border-radius:12px;padding:16px 18px}
.howto h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.hg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:760px){.hg{grid-template-columns:1fr 1fr}}
.hg b{font:500 11px var(--mono);color:var(--accent)}.hg h4{font-size:15px;color:var(--heading);margin:2px 0 3px}.hg p{font-size:13.5px;color:var(--ink-2)}

/* sections */
section{padding-top:52px}
section h2{display:flex;align-items:baseline;gap:14px;font:700 clamp(21px,3vw,27px)/1.2 var(--display);color:var(--heading);padding-bottom:10px;border-bottom:1.5px solid var(--heading);margin-bottom:18px;text-wrap:balance}
.sn{font:500 14px var(--mono);color:var(--accent);flex:none}
.grp-h{margin-top:56px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:12px}
.grp-h::after{content:"";flex:1;height:1px;background:var(--line)}
.lede{color:var(--ink-2);max-width:70ch;margin-bottom:20px}
.lede q{font-style:italic;color:var(--ink)}
.lede small{font:500 11px var(--mono);color:var(--ink-3)}
.prose{display:grid;gap:12px;max-width:70ch}
.prose p{color:var(--ink)}
.subh{font:700 17px var(--display);color:var(--heading);margin:30px 0 10px}
.chip{display:inline-block;font:500 10.5px var(--mono);border-radius:999px;padding:1px 8px;margin-left:6px;white-space:nowrap;vertical-align:1px}
.chip.upd{background:var(--accent-soft);color:var(--accent);border:0;margin-top:0}
.ids{font:500 11px var(--mono);color:var(--accent)}

/* pillars and approvals */
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:24px}
@media(max-width:760px){.pillars{grid-template-columns:1fr}}
.pillars>div{border-top:3px solid var(--navy);background:var(--sunk);border-radius:0 0 10px 10px;padding:14px 16px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pillars>div{border-top-color:var(--cyan)}}
:root[data-theme="dark"] .pillars>div{border-top-color:var(--cyan)}
.pillars .pn{font:500 12px var(--mono);color:var(--accent)}
.pillars h3{font:700 16px/1.3 var(--display);color:var(--heading);margin:4px 0 6px}
.pillars p{font-size:14px;color:var(--ink-2)}
.approve{margin-top:26px;background:var(--navy);color:var(--white);border-radius:12px;padding:20px 22px}
.approve h3{font:700 18px var(--display)}
.approve ol{list-style:none;padding:0;margin-top:12px;display:grid;gap:8px}
.approve li{display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:15px}
.approve li span{font:700 13px var(--mono);color:var(--cyan);padding-top:2px}
.approve .def{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25);font-size:14px}
.approve .def b{color:var(--cyan)}

/* figure 1 */
.fig{margin-top:30px}
.fig figcaption{font-size:13px;color:var(--ink-3);margin-top:8px}
.fig figcaption b{color:var(--ink-2)}
.dg{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px}
.sc{overflow-x:auto}
.sc svg{display:block;width:100%;min-width:var(--minw,860px);height:auto}
.glance text{font-family:var(--sans)}
.glance .gbox{fill:var(--sunk);stroke:var(--line);stroke-width:1.2}
.glance .gcore{fill:var(--navy)}
.glance .gt{font-size:14px;font-weight:700;fill:var(--ink);text-anchor:middle}
.glance .gs{font-size:12px;fill:var(--ink-2);text-anchor:middle}
.glance .gct{font-size:17px;font-weight:700;fill:var(--white);text-anchor:middle}
.glance .gcs{font-size:12.5px;fill:var(--cyan);text-anchor:middle}
.glance .gl{stroke:var(--ink-3);stroke-width:1.5;fill:none}
.glance .ah{fill:var(--ink-3)}
.glance .gh{font-size:11px;font-weight:700;letter-spacing:.12em;fill:var(--ink-3);text-anchor:middle}
.glance .el{font-size:11px;font-weight:600;fill:var(--ink-2);text-anchor:middle;paint-order:stroke;stroke:var(--paper);stroke-width:4px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
thead th{background:var(--thead);color:var(--thead-ink);text-align:left;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:12px 16px}
tbody th,tbody td{padding:13px 16px;vertical-align:top;text-align:left;border-top:1px solid var(--line)}
tbody tr:nth-child(even):not(.grp){background:var(--sunk)}
tbody th{font-weight:700;width:24%;color:var(--ink)}
tbody td{color:var(--ink-2)}
tr.grp td{background:var(--paper);color:var(--heading);font:700 16px var(--display);padding:18px 16px 8px;border-top:1.5px solid var(--line)}
.q{display:block;font-style:italic;color:var(--ink);margin-top:6px}
.q small{display:block;font-style:normal;font:500 11px var(--mono);color:var(--ink-3);margin-top:2px}
.impl{color:var(--ink)}
.st{display:inline-block;font:600 12px var(--sans);border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.cl{background:var(--ok-bg);color:var(--ok)}.st.op{background:var(--warn-bg);color:var(--warn)}
.size{display:inline-block;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 10px;white-space:nowrap;color:var(--ink-2)}

/* pain rows, numbers, replaced */
.prow{display:grid;grid-template-columns:190px minmax(0,1fr) 22px minmax(0,1fr);gap:14px;padding:13px 0;border-top:1px solid var(--line);font-size:14px;align-items:start}
.prow.hd{border-top:0;padding-bottom:6px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.prow b{font-weight:700}.prow .pt{color:var(--ink-2)}.prow .pf{color:var(--ink);font-weight:600}.prow i{font-style:normal;color:var(--accent);font-weight:700}
@media(max-width:640px){.prow{grid-template-columns:1fr;gap:4px}.prow i,.prow.hd{display:none}.prow .pf::before{content:"At go-live: ";color:var(--accent)}}
.callout{display:flex;gap:14px;margin-top:18px;background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:14px 16px}
.callout>b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--warn);color:var(--paper);display:flex;align-items:center;justify-content:center}
.callout h4{font-size:15px;color:var(--warn)}.callout p{font-size:14px;color:var(--ink-2);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:4px 0 22px}
@media(max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.stats>div{border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.stats b{display:block;font:700 26px/1.1 var(--display);color:var(--heading);font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.stats small{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px}
.repl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rr{display:grid;grid-template-columns:170px minmax(0,1fr) 24px minmax(0,1.2fr);gap:12px;align-items:center;padding:12px 16px;font-size:14px}
.rr+.rr{border-top:1px solid var(--line)}
.rr:nth-child(even){background:var(--sunk)}
.rl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.ro{color:var(--ink-3)}.rr i{font-style:normal;color:var(--accent);font-weight:700}.rn{font-weight:600;color:var(--heading)}
@media(max-width:640px){.rr{grid-template-columns:1fr;gap:4px}.rr i{display:none}}
.stays{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13px}
.stays b{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-right:4px}
.stays span{border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink-2)}

/* layers, journeys, scope */
.layers{list-style:none;padding:0;display:grid;gap:10px}
.layers li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:14px 16px}

.layers h3{font:700 16px var(--display);color:var(--heading)}
.layers p{font-size:14px;color:var(--ink-2);margin-top:3px}
.scope{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.dots{padding-left:18px;display:grid;gap:8px}.dots b{color:var(--ink)}
.principle{margin-top:18px;border-left:3px solid var(--navy);padding:4px 0 4px 16px;max-width:70ch}

:root[data-theme="dark"] .principle{border-left-color:var(--cyan)}
.principle h4{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}

.inputs li>span{font:700 13px var(--mono);color:var(--accent);padding-top:2px}
.own{font-style:normal;display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;color:var(--heading);background:var(--sunk);border-radius:999px;padding:1px 9px;white-space:nowrap}
.tl{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:760px){.tl{grid-template-columns:1fr}}
.tl>div{padding:14px 16px;position:relative;min-width:0}
.tl>div+div{border-left:1px solid var(--line)}
@media(max-width:760px){.tl>div+div{border-left:0;border-top:1px solid var(--line)}}
.tl b{font:500 11px var(--mono);color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.tl h4{font:700 15px var(--display);color:var(--heading);margin:4px 0 3px}
.tl p{font-size:13px;color:var(--ink-2)}

<script>
(function(){
  var D = JSON.parse(document.getElementById('ro-data').textContent), P = D.project, INC = D.include || {};
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  /* ---------- text wrapping ---------- */
  function wrap(text, max){

  /* ---------- swimlane renderer: data in, one SVG out ---------- */
  var COLW = 172, NODEW = 140, LANEH = 128, PADX = 150, TOP = 26, GAP = COLW - NODEW; /* GAP = 32 */
  function renderFlow(wf){
    var lanes = wf.lanes, nodes = wf.nodes, edges = wf.edges || [];
    var byId = {}, maxCol = 0;
    /* measure */
    nodes.forEach(function(n){
      n.tl = wrap(n.title, 17); n.sl = n.sub ? wrap(n.sub, 21) : [];
      if (n.type === 'decision') { n.w = 128; n.h = 88; }
      else { n.w = NODEW; n.h = 16 + n.tl.length * 17 + (n.sl.length ? 4 + n.sl.length * 15 : 0) + 10; }
      maxCol = Math.max(maxCol, n.col);
      byId[n.id] = n;
    });
    /* lanes may need to grow when two nodes sit stacked (rowOffset) */
    var laneH = lanes.map(function(){ return LANEH; });
    nodes.forEach(function(n){ if (n.rowOffset) { laneH[n.lane] = Math.max(laneH[n.lane], LANEH + n.h + 24); } });
    var laneY = [], y = TOP; lanes.forEach(function(l, i){ laneY.push(y); y += laneH[i] + 6; });
    var H = y + 6, W = PADX + (maxCol + 1) * COLW + 20;
    /* place */
    nodes.forEach(function(n){
      n.x = PADX + n.col * COLW + (NODEW - n.w) / 2;
      var cy = laneY[n.lane] + LANEH / 2 + (n.rowOffset ? (LANEH / 2 + n.h / 2 + 12) * n.rowOffset : 0);
      n.cx = n.x + n.w / 2; n.cy = cy; n.y = cy - n.h / 2;
      n.left = n.x; n.right = n.x + n.w; n.top = n.y; n.bottom = n.y + n.h;
    });
    var s = [];
    var mid = 'ah' + wf.id.replace(/\W/g, '');
    s.push('<svg viewBox="0 0 ' + W + ' ' + H + '" class="fl" role="img" aria-label="' + esc(wf.name) + ' workflow, by role: ' + esc(nodes.map(function(n){ return n.title; }).join('; ')) + '">');
    s.push('<defs><marker id="' + mid + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker></defs>');
    lanes.forEach(function(l, i){
      s.push('<rect x="0" y="' + laneY[i] + '" width="' + W + '" height="' + laneH[i] + '" rx="10" class="lane' + (i % 2 ? ' alt' : '') + '"/>');
      var ll = wrap(l, 14), ly = laneY[i] + laneH[i] / 2 - (ll.length - 1) * 8;
      ll.forEach(function(t, k){ s.push('<text x="16" y="' + (ly + k * 16 + 4) + '" class="lnl">' + esc(t) + '</text>'); });
    });
    /* edges */
    edges.forEach(function(e){
      var a = byId[e.from], b = byId[e.to]; if (!a || !b) return;
      var d, lx, ly, anchor = 'start';
      var via = e.via || (a.cy === b.cy ? 'right' : 'right');
      if (via === 'right') {
        if (Math.abs(a.cy - b.cy) < 1) { d = 'M' + a.right + ',' + a.cy + ' L' + b.left + ',' + b.cy; }
        else { var kx = a.right + GAP / 2; d = 'M' + a.right + ',' + a.cy + ' L' + kx + ',' + a.cy + ' L' + kx + ',' + b.cy + ' L' + b.left + ',' + b.cy; }
        lx = a.right + 5; ly = a.cy - 7;
      } else if (via === 'bottom') {
        if (b.left > a.right) { d = 'M' + a.cx + ',' + a.bottom + ' L' + a.cx + ',' + b.cy + ' L' + b.left + ',' + b.cy; }
        else { d = 'M' + a.cx + ',' + a.bottom + ' L' + a.cx + ',' + b.top; }
        lx = a.cx + 6; ly = a.bottom + 14;
      } else if (via === 'up') {
        /* from a stacked node up into a node in the same column above, or to the right */
        if (b.left > a.right) { var kx2 = a.right + GAP / 2; d = 'M' + a.right + ',' + a.cy + ' L' + kx2 + ',' + a.cy + ' L' + kx2 + ',' + b.cy + ' L' + b.left + ',' + b.cy; lx = a.right + 5; ly = a.cy - 7; }

        s.push('<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="8" class="nd ' + n.type + '"/>');
        var inv = n.type === 'new' ? ' inv' : n.type === 'end' ? ' endt' : n.type === 'open' ? ' opent' : '';
        var yy = n.y + 22;
        n.tl.forEach(function(t){ s.push('<text x="' + n.cx + '" y="' + yy + '" class="nt' + inv + '">' + esc(t) + '</text>'); yy += 17; });
        yy += 1;
        n.sl.forEach(function(t){ s.push('<text x="' + n.cx + '" y="' + yy + '" class="ns' + (n.type === 'new' ? ' inv' : n.type === 'end' ? ' endt' : '') + '">' + esc(t) + '</text>'); yy += 15; });

    });
    s.push('</svg>');
    return { svg: s.join(''), minw: Math.min(W, 1200) };
  }

  /* ---------- overview renderer ---------- */
  function renderOverview(){
    var top = 40, W = 1180, mid = 'ahov';
    /* measure each row first */
    var rows = WFS.map(function(wf){
      var after = (wf.after || []).slice(0, 3).map(function(a){ return wrap(a, 50).slice(0, 2); });
      var pillH = after.map(function(l){ return 16 + l.length * 14; });

    });

    s.push('<defs><marker id="' + mid + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahd"/></marker></defs>');
    [['Workflow', 10, 180], ['The work', 216, 740], ['After it', 776, 1172]].forEach(function(c){
      s.push('<text x="' + ((c[1] + c[2]) / 2) + '" y="22" class="colh">' + c[0] + '</text><path d="M' + c[1] + ',32 L' + c[2] + ',32" class="rule"/>');

    rows.forEach(function(r, i){
      var wf = r.wf, rowH = r.h, cy = y + rowH / 2;
      s.push('<rect x="4" y="' + y + '" width="' + (W - 8) + '" height="' + rowH + '" rx="12" class="lane' + (i % 2 ? ' alt' : '') + '"/>');
      s.push('<a href="#' + wf.id.toLowerCase() + '" class="go" data-go="' + wf.id.toLowerCase() + '"><rect x="14" y="' + (cy - 28) + '" width="166" height="56" rx="9" class="nd wbox"/><text x="97" y="' + (cy - 8) + '" class="wid">' + esc(wf.id) + '</text>');
      var nl = wrap(wf.name, 22); nl.slice(0, 2).forEach(function(t, k){ s.push('<text x="97" y="' + (cy + 9 + k * 15) + '" class="wt">' + esc(t) + '</text>'); });
      s.push('</a>');
      s.push('<path d="M180,' + cy + ' L206,' + cy + '" class="ed" marker-end="url(#' + mid + ')"/>');
      var work = wf.nodes.filter(function(n){ return n.type !== 'decision'; }).slice(0, 4);
      var bw = Math.floor((740 - 216 - (work.length - 1) * 14) / work.length);
      work.forEach(function(n, k){
        var x = 216 + k * (bw + 14);

        s.push('<circle cx="' + x + '" cy="' + (cy - 26) + '" r="8" class="sb"/><text x="' + x + '" y="' + (cy - 23) + '" class="sbt" style="font-size:9.5px">' + n.step + '</text>');

  allS.addEventListener('click', function(){ panel.hidden = !panel.hidden; allS.setAttribute('aria-expanded', String(!panel.hidden)); });
  panel.addEventListener('click', function(e){ if (e.target.closest('a')) { panel.hidden = true; allS.setAttribute('aria-expanded', 'false'); } });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !panel.hidden) { panel.hidden = true; allS.setAttribute('aria-expanded', 'false'); allS.focus(); } });
  document.addEventListener('click', function(e){ if (!panel.hidden && !e.target.closest('#sbar')) { panel.hidden = true; allS.setAttribute('aria-expanded', 'false'); } });

  /* ---------- internal notes toggle (off by default) ---------- */
  var hasInt = Object.keys(D.internal || {}).some(function(k){ return (D.internal[k] || []).length; });
  var ibar = document.getElementById('ibar'), ib = document.getElementById('intBtn');
  ibar.hidden = !hasInt;
  ib.addEventListener('click', function(){ var on = ib.getAttribute('aria-pressed') !== 'true'; ib.setAttribute('aria-pressed', String(on)); document.body.classList.toggle('show-int', on); });

  if (location.hash) { var t = document.getElementById(location.hash.slice(1)); if (t) setTimeout(function(){ t.scrollIntoView(); }, 0); }
})();
</script>
