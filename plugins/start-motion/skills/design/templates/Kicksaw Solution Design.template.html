<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* A plain working document with a contents rail. Decisions sit inside the sections they affect; one bar takes the architect from one decision to the next. */
:root{
  color-scheme:light;
  --navy:#03355E; --blue:#0071B9; --cyan:#44C8F5; --orange:#DD6443; --charcoal:#414042; --smoke:#EFEFEF;
  --paper:#FFFFFF; --wash:#F6F8FA; --line:#D9E0E6; --muted:#6B7780; --tint:#EAF4FB; --needs:#FCEFEA; --ok:#1F7A4D; --okbg:#E8F4EE;
  --display:"Inter",Arial,sans-serif; --body:"Source Sans 3","Source Sans Pro",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--wash);color:var(--charcoal);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);color:var(--navy);text-wrap:balance;margin:0}
button{font-family:var(--body);font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--paper);color:var(--navy);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--blue)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:600}
button.pri:disabled,button:disabled{background:var(--smoke);color:var(--muted);border-color:var(--line);cursor:not-allowed}
button.link{border:none;background:none;padding:0;color:var(--blue);text-decoration:underline;text-underline-offset:2px;font-size:13px}
input[type=text],textarea{font-family:var(--body);font-size:14px;width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--charcoal);background:var(--paper)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em;background:var(--smoke);padding:1px 5px;border-radius:4px;color:var(--navy)}
a{color:var(--blue)}

.bar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(3,53,94,.06)}
.bar-in{max-width:1180px;margin:0 auto;padding:9px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.bar .lbl{font-family:var(--display);font-weight:600;color:var(--navy);font-size:14px}
.bar .cnt{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:5px;flex:1;min-width:120px;flex-wrap:wrap}
.dot{width:26px;height:22px;border-radius:5px;border:1.5px solid var(--orange);background:var(--paper);font-size:10px;font-family:var(--display);color:var(--orange);padding:0;line-height:1;font-variant-numeric:tabular-nums}
.dot.pick{background:var(--orange);color:#fff}
.dot.done{border-color:var(--ok);background:var(--ok);color:#fff}
.dot.lock{border-color:var(--line);color:var(--muted);background:var(--smoke)}
.dot.park{border-color:var(--blue);color:var(--blue)}
.bar.fin{background:var(--okbg)}

.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 80px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}
.rail{position:sticky;top:64px;align-self:start;font-size:14px}
.rail h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.rail a{display:flex;justify-content:space-between;gap:8px;padding:4px 0;color:var(--charcoal);text-decoration:none;border-bottom:1px solid var(--line)}
.rail a:hover{color:var(--blue)}
.pill{font-size:11px;border-radius:10px;padding:0 7px;line-height:18px;white-space:nowrap;font-weight:600;align-self:flex-start}
.pill.n{background:var(--needs);color:var(--orange)}
.pill.d{background:var(--okbg);color:var(--ok)}
.pill.l{background:var(--smoke);color:var(--muted)}
.doc{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:32px 40px 40px;min-width:0}
.doc-h{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;border-bottom:2px solid var(--navy);padding-bottom:16px}
.doc-h .logo svg{height:26px;width:auto}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);font-weight:700}
.doc-h h1{font-size:26px;margin:2px 0 4px}
.meta{font-size:14px;color:var(--muted)}
.status{font-size:13px;font-weight:600;border-radius:4px;padding:2px 8px;background:var(--needs);color:var(--orange)}
.status.ok{background:var(--okbg);color:var(--ok)}
.needs{background:var(--needs);border-left:4px solid var(--orange);border-radius:4px;padding:14px 18px;margin:20px 0 0}
.needs h2{font-size:16px;margin-bottom:4px}
.needs ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.changed{background:var(--tint);border-left:4px solid var(--blue);border-radius:4px;padding:14px 18px;margin:20px 0 0;font-size:15px}
.changed h2{font-size:16px;margin-bottom:4px}
.changed ul{margin:6px 0 0;padding-left:18px}
section.s{margin-top:34px;scroll-margin-top:70px}
section.s>h2{font-size:20px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
section.s>h2 .num{color:var(--blue);font-variant-numeric:tabular-nums}
section.s h3{font-size:16px;margin:18px 0 4px}
.rw{font-size:11px;font-weight:600;font-family:var(--body);background:var(--tint);color:var(--blue);border-radius:4px;padding:1px 7px}
section.s p,section.s .lede{max-width:68ch;margin:8px 0 12px}
section.s ol,section.s ul{margin:0 0 12px;padding-left:22px;max-width:72ch}
section.s li{margin:3px 0}
.who{font-weight:600;color:var(--navy)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0 12px}
th{text-align:left;font-family:var(--display);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:1.5px solid var(--navy);padding:6px 10px 6px 0}
td{border-bottom:1px solid var(--line);padding:7px 10px 7px 0;vertical-align:top}
.tbd{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--smoke);color:var(--charcoal);white-space:nowrap}
.callout{border-left:3px solid var(--blue);background:var(--tint);padding:8px 12px;margin:8px 0 12px;font-size:14.5px;max-width:72ch}
.callout b{color:var(--navy)}
.mk{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;white-space:nowrap}
.mk.guess{background:var(--needs);color:var(--orange)}
.mk.done{background:var(--okbg);color:var(--ok)}
.cm{margin-top:6px}
.cm textarea{margin-top:6px;min-height:54px}
.erd,.fig{border:1px solid var(--line);border-radius:6px;background:var(--wash);padding:8px;margin:8px 0 12px;overflow-x:auto}
.erd svg,.fig svg{max-width:100%;height:auto;display:block;margin:0 auto}

.dc{border:1.5px solid var(--orange);border-radius:8px;padding:16px 18px;margin:14px 0;background:var(--paper);scroll-margin-top:120px}
.dc.flash{animation:fl 1.2s ease-out}
@keyframes fl{0%{box-shadow:0 0 0 6px rgba(221,100,67,.35)}100%{box-shadow:0 0 0 0 rgba(221,100,67,0)}}
@media (prefers-reduced-motion:reduce){.dc.flash{animation:none}}
.dc .flag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--orange);border-radius:4px;padding:1px 8px;margin-bottom:6px}
.dc .q{font-family:var(--display);font-weight:600;color:var(--navy);font-size:16px}
.dc .ask{margin-top:4px}
.dc .why{font-size:14px;color:var(--muted);margin-top:2px}
.ctx{margin:10px 0 12px;padding:8px 12px;background:var(--wash);border-radius:6px;font-size:13.5px;color:var(--muted)}
.ctx b{color:var(--charcoal);font-weight:600}
.ctx i{color:var(--charcoal)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.opt{display:grid;grid-row:span 8;grid-template-rows:subgrid;row-gap:4px;text-align:left;padding:12px;border-radius:6px;align-content:start;color:var(--charcoal);white-space:normal;line-height:1.4}
.opt.on{border:2px solid var(--blue);background:var(--tint);padding:11px}
.opt .nm{font-family:var(--display);font-weight:600;color:var(--navy);font-size:14.5px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.opt .ln{font-family:var(--body);font-size:11px;font-weight:600;color:var(--blue);white-space:nowrap}
.opt .sm{font-size:13.5px;color:var(--muted)}
.r{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;font-size:13px}
.r>span:first-child{color:var(--muted)}
.r.first{border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.rec{font-size:14px;margin-top:10px}
.rec b{font-weight:600;color:var(--navy)}
.lks{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.lks .on{font-weight:700;color:var(--navy)}
.dc input[type=text]{margin-top:8px}
.dc.slim{border:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:14.5px}
.dc.slim.done{border-color:var(--ok);background:var(--okbg)}
.dc.slim.lock,.dc.slim.drop{background:var(--smoke);color:var(--muted)}
.dc.slim.drop{text-decoration:line-through}
.dc.slim.park{border-color:var(--blue);background:var(--tint)}
.dc.slim .g{flex:1;min-width:200px}
.dc.recrow.picked{background:var(--needs)}
.seg{display:inline-flex;gap:6px}
.seg .on{background:var(--navy);color:#fff;border-color:var(--navy)}

.modal{position:fixed;inset:0;background:rgba(3,53,94,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal[hidden]{display:none}
.modal .box{background:var(--paper);border-radius:10px;max-width:640px;width:100%;padding:22px 24px;max-height:90%;overflow:auto}
.modal h2{font-size:18px;margin-bottom:6px}
.modal pre{background:var(--wash);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;margin:10px 0;user-select:all}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal .ok{color:var(--ok);font-weight:600;font-size:14px;flex:1}
.modal .warn{color:var(--orange);font-size:14px;margin-bottom:8px}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr;gap:0}
  .rail{display:none}
  .doc{padding:20px 18px 28px}
  .bar .lbl{display:none}
  .bar-in{gap:8px;padding:8px 12px}
}
@media print{
  body{background:#fff}
  .bar,.rail,.cm,.modal,.needs,.changed{display:none!important}
  .wrap{display:block;padding:0}
  .doc{border:none;padding:0}
  .dc{break-inside:avoid}
  *{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="wrap">
  <nav class="rail" id="rail" aria-label="Contents"></nav>
  <main class="doc" id="doc"></main>
</div>
<div class="modal" id="modal" hidden><div class="box" id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-h"></div></div>

<script id="design-data" type="application/json">%%DATA%%</script>
<script>
(function(){
const LOGO=`%%LOGO%%`;
const DATA=JSON.parse(document.getElementById('design-data').textContent);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=s=>esc(s).replace(/\b(\w+__(c|mdt|e|r))\b/g,'<code>$1</code>');
const DEC=DATA.decisions||[],SECS=DATA.sections||[],FINAL=DATA.status==='Final';
const byId=id=>DEC.find(d=>d.id===id);
const KEY='ks-design:'+DATA.client+':'+DATA.version;
let picks={},comments={},openCm={};
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');picks=s.picks||{};comments=s.comments||{}}catch(e){}
Object.keys(picks).forEach(id=>{if(!byId(id))delete picks[id]});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({picks,comments}))}catch(e){}};
const isAsk=d=>d.kind==='sa'||d.kind==='recommended';
const actionable=()=>DEC.filter(d=>isAsk(d)&&d.status!=='dropped');
const structuralOpen=()=>DEC.filter(d=>d.structural&&d.status==='open');
function lockedBy(d){if(d.status!=='open'||d.structural)return '';if(structuralOpen().length)return 'the structural decisions are applied';if(d.depends_on){const p=byId(d.depends_on);if(p&&p.status!=='decided')return p.id+' is decided'}return ''}
const optName=(d,k)=>{const o=(d.opts||[]).find(o=>o.k===k);return o?o.name:''};
const isKey=(d,k)=>(d.opts||[]).some(o=>o.k===k);
const pendingCount=()=>Object.keys(picks).length+Object.values(comments).filter(t=>t&&t.trim()).length;
const secLabel=s=>(s.num?s.num+' ':'')+s.title;
function mark(id){const d=byId(id);if(!d)return '';if(FINAL)return '';
  if(d.status==='decided')return `<span class="mk done">Decided · ${id}</span>`;
  if(d.status==='parked')return `<span class="mk guess">Parked · ${id}</span>`;
  if(d.status==='dropped')return '';
  return `<span class="mk guess">${d.kind==='sa'&&!d.lean?'Open':'Written on Claude\'s pick'} · ${id}</span>`}

function card(d){
  const id=d.id,at=`data-id="${id}"`,el=`id="dec-${id}"`,st=picks[id]||{};
  if(d.status==='dropped')return `<div class="dc slim drop" ${el}><span class="g">${id} · ${esc(d.q)}</span><span>No longer applies${d.depends_on?' after '+d.depends_on:''}</span></div>`;
  if(d.kind==='client')return `<div class="dc slim park" ${el}><span class="g"><b>With the client · ${id}</b> · ${esc(d.q)}${d.why?'. '+esc(d.why):''}</span><span>${esc(d.ref||'')}</span></div>`;
  const lk=lockedBy(d);
  if(lk)return `<div class="dc slim lock" ${el}><span class="g">${id} · ${esc(d.q)}</span><span>Opens once ${lk}</span></div>`;
  if(d.status==='decided'&&!st.pick)return `<div class="dc slim done" ${el}><span class="g"><b>Decided · ${id}</b> · ${esc(d.q)}: ${esc(d.chosen||'')}${d.why_chosen?'. '+esc(d.why_chosen):''}${d.by?' ('+esc(d.by)+')':''}</span><button class="link" data-act="change" ${at}>Change</button></div>`;
  if(d.status==='parked'&&!st.pick)return `<div class="dc slim park" ${el}><span class="g"><b>Parked · ${id}</b> · ${esc(d.q)}. ${esc(d.parked_for?'Claude is finding out: '+d.parked_for+'.':'Waiting on more information.')} It comes back to you here.</span><button class="link" data-act="change" ${at}>Decide now</button></div>`;
  if(d.kind==='recommended'){
    let h=`<div class="dc recrow${st.pick?' picked':''}" ${el}><span class="flag">Confirm · ${id}</span><div class="q">${esc(d.q)}</div><div class="ask">Claude went ahead on: <b>${esc(d.pick)}</b>. ${esc(d.why||'')}${d.alt?' The other way: '+esc(d.alt)+'.':''}</div><div class="lks"><span class="seg"><button data-act="pick" data-k="ok" ${at} class="${st.pick==='ok'?'on':''}" aria-pressed="${st.pick==='ok'}">Confirm</button><button data-act="pick" data-k="own" ${at} class="${st.pick==='own'?'on':''}" aria-pressed="${st.pick==='own'}">Change it</button></span></div>`;
    if(st.pick==='own')h+=`<input type="text" id="own-${id}" data-f="text" ${at} placeholder="What you want instead" value="${esc(st.text||'')}">`;
    return h+'</div>'}
  const rows=o=>[['Gains',esc(o.gain)],['Costs',esc(o.cost)],['Risk',esc(o.risk)],['Builds',(o.builds||[]).map(api).join('; ')],['Undo later',esc(o.undo)],['Effort',esc(o.effort)]];
  let h=`<div class="dc" ${el}><span class="flag">${d.structural?'Structural decision':'Needs you'} · ${id}</span><div class="q">${esc(d.q)}</div>${d.ask?`<div class="ask">${esc(d.ask)}</div>`:''}${d.why?`<div class="why">${esc(d.why)}</div>`:''}`;
  const ctx=`${d.said?`<div><b>Client said</b> <i>${esc(d.said)}</i></div>`:''}${d.today?`<div><b>In the org today</b> ${esc(d.today)}</div>`:''}${d.reqs?`<div><b>Requirement</b> ${esc(d.reqs)}</div>`:''}${d.shapes&&d.shapes.length?`<div><b>Sections it shapes</b> ${esc(d.shapes.join(', '))}</div>`:''}`;
  if(ctx)h+=`<div class="ctx">${ctx}</div>`;
  h+=`<div class="opts">${(d.opts||[]).map(o=>`<button class="opt${st.pick===o.k?' on':''}" aria-pressed="${st.pick===o.k}" data-act="pick" data-k="${esc(o.k)}" ${at}><div class="nm"><span>${esc(o.k)} · ${esc(o.name)}</span>${d.lean===o.k?'<span class="ln">Claude\'s pick</span>':''}</div><div class="sm">${esc(o.sum||'')}</div>${rows(o).map((r,i)=>`<div class="r${i?'':' first'}"><span>${r[0]}</span><span>${r[1]||'<span style="color:var(--muted)">Not given</span>'}</span></div>`).join('')}</button>`).join('')}</div>`;
  h+=d.lean?`<div class="rec"><b>Claude recommends ${esc(d.lean)}, ${esc(optName(d,d.lean).toLowerCase())}.</b> ${esc(d.lean_why||'')}${d.change_if?' This changes if '+esc(d.change_if)+'.':''}</div>`:`<div class="rec"><b>Claude has no lean.</b> ${esc(d.lean_why||'')}</div>`;
  h+=`<div class="lks"><button class="link${st.pick==='own'?' on':''}" data-act="pick" data-k="own" ${at}>Something else</button><button class="link${st.pick==='more'?' on':''}" data-act="pick" data-k="more" ${at}>I need more first</button></div>`;
  if(st.pick==='own')h+=`<input type="text" id="own-${id}" data-f="text" ${at} placeholder="Your decision" value="${esc(st.text||'')}">`;
  if(st.pick==='more')h+=`<input type="text" id="more-${id}" data-f="text" ${at} placeholder="What you need: a sandbox test, a question to the client, a colleague's view" value="${esc(st.text||'')}">`;
  if(st.pick&&isKey(d,st.pick))h+=`<input type="text" id="why-${id}" data-f="reason" ${at} placeholder="Why, in a line (optional). It becomes the reason in the decision log" value="${esc(st.reason||'')}">`;
  return h+'</div>'}
const cards=sec=>FINAL?'':DEC.filter(d=>d.section===sec&&d.kind!=='clear').map(card).join('');

function auto(kind){
  if(kind==='key-decisions'){const done=actionable().filter(d=>d.status==='decided'),open=actionable().filter(d=>d.status!=='decided'),cl=DEC.filter(d=>d.kind==='client'&&d.status!=='decided'&&d.status!=='dropped');
    return (done.length?`<div class="tw"><table><thead><tr><th>Decision</th><th>Chosen</th><th>Why</th></tr></thead><tbody>${done.map(d=>`<tr><td>${esc(d.q)}</td><td>${esc(d.chosen||'')}</td><td>${esc(d.why_chosen||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p>No decisions are recorded yet.</p>')+(FINAL?'':(open.length?`<p>Still open with the solution architect: ${open.map(d=>d.id).join(', ')}.</p>`:'<p>Nothing is open with the solution architect.</p>'))+(cl.length?`<p>With the client: ${cl.map(d=>esc(d.q)+' ('+esc(d.ref||d.id)+')').join('; ')}.</p>`:'')}
  if(kind==='claude-calls'){if(FINAL)return '';return `<p>These had one sound answer, so Claude made the call and logged it. Approving the design accepts them. Reopen any you would have made differently.</p>${DEC.filter(d=>d.kind==='clear').map(d=>{const p=picks[d.id];return `<div class="dc slim" id="dec-${d.id}"><span class="g"><b>${d.id}</b> · ${esc(d.q)}: ${esc(d.chosen||'')}. ${esc(d.why_chosen||'')}</span><button class="link" data-act="pick" data-k="reopen" data-id="${d.id}">${p?'Keep it':'Reopen'}</button>${p?`<input type="text" id="ro-${d.id}" data-f="text" data-id="${d.id}" placeholder="What you would do differently" value="${esc(p.text||'')}">`:''}</div>`}).join('')}`}
  if(kind==='change-log')return `<div class="tw"><table><thead><tr><th>Version</th><th>Date</th><th>What changed</th></tr></thead><tbody>${(DATA.log||[]).map(l=>`<tr><td>${esc(l[0])}</td><td>${esc(l[1])}</td><td>${esc(l[2])}</td></tr>`).join('')}</tbody></table></div>`;
  return ''}
function comment(s){if(FINAL||s.auto)return '';const t=comments[s.id],o=openCm[s.id]||t;
  return `<div class="cm">${o?`<label for="cm-${s.id}" style="font-size:13px;color:var(--muted)">Your comment on this section goes to Claude with your decisions</label><textarea id="cm-${s.id}" data-f="comment" data-sec="${s.id}" placeholder="Anything you would change here, even if Claude did not flag it">${esc(t||'')}</textarea>`:`<button class="link" data-act="cm" data-sec="${s.id}">Comment on this section</button>`}</div>`}
function secState(s){const ds=DEC.filter(d=>d.section===s.id&&isAsk(d)&&d.status!=='dropped');if(!ds.length||FINAL)return '';const open=ds.filter(d=>d.status!=='decided');if(!open.length)return '<span class="pill d">Decided</span>';const now=open.filter(d=>d.status==='open'&&!lockedBy(d));if(!now.length)return `<span class="pill l">${open.length} later</span>`;return `<span class="pill n">${now.length} to decide</span>`}

function render(){
  const act=actionable(),open=act.filter(d=>d.status!=='decided'),cur=open.filter(d=>d.status==='open'&&!lockedBy(d)),lockedN=open.filter(d=>lockedBy(d)).length,answered=cur.filter(d=>picks[d.id]).length,pend=pendingCount(),struct=cur.some(d=>d.structural),allDone=!open.length;
  document.getElementById('rail').innerHTML=`<h3>Contents</h3>${SECS.map(s=>`<a href="#sec-${s.id}"><span>${esc(secLabel(s))}</span>${secState(s)}</a>`).join('')}`;
  const bar=document.getElementById('bar');
  if(FINAL){bar.hidden=true}else{
    const dots=act.map(d=>{const c=picks[d.id]?'pick':d.status==='decided'?'done':d.status==='parked'?'park':lockedBy(d)?'lock':'';return `<button class="dot ${c}" data-act="jump" data-id="${d.id}" title="${d.id} · ${esc(d.q)}" aria-label="Go to ${d.id}, ${esc(d.q)}">${esc(d.id.replace(/^D-/,''))}</button>`}).join('');
    bar.className='bar'+(allDone&&!pend?' fin':'');
    bar.innerHTML=`<div class="bar-in">${allDone&&!pend?`<span class="lbl">${DATA.approved?'Approved by '+esc(DATA.approved)+'.':'Every decision is made.'}</span><span class="dots">${dots}</span>${DATA.approved?'':`<button class="pri" data-act="approve">Approve draft ${esc(DATA.version)}</button>`}`
      :`<span class="lbl">${struct?'Start here: structural decisions':'Remaining decisions'}</span><span class="cnt">${answered} of ${cur.length} answered${lockedN?' · '+lockedN+' more open after these':''}</span><span class="dots">${dots}</span><button data-act="next"${cur.length===answered?' disabled':''}>Next decision ↓</button><button class="pri" data-act="send"${pend?'':' disabled'}>Send ${pend||''} to Claude</button>`}</div>`}
  let h=`<div class="doc-h"><div><div class="eyebrow">Solution design · ${esc(DATA.platform||'Salesforce')}</div><h1>${esc(DATA.title||DATA.client)}</h1><div class="meta">${esc(DATA.client)}${DATA.subtitle?' · '+esc(DATA.subtitle):''} · prepared by ${esc(DATA.architect||'the solution architect')} · ${esc(DATA.date||'')} · ${esc(DATA.version||'')}</div>${DATA.review_link?`<div class="meta"><a href="${esc(DATA.review_link)}">Design and build review page</a></div>`:''}</div><div style="text-align:right"><span class="logo">${LOGO}</span><div style="margin-top:8px"><span class="status${FINAL||DATA.approved?' ok':''}">${FINAL?'Final':DATA.approved?'Draft, approved by the SA':'Draft'}</span></div></div></div>`;
  if(!FINAL&&DATA.changed&&DATA.changed.length)h+=`<div class="changed"><h2>What changed because of your decisions</h2><ul>${DATA.changed.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>`;
  if(!FINAL&&!allDone){const nSa=open.filter(d=>d.kind==='sa').length,nRec=open.filter(d=>d.kind==='recommended').length,nCl=DEC.filter(d=>d.kind==='clear').length;
    h+=`<div class="needs"><h2>Open for the solution architect</h2><div>Where a choice was yours to make, Claude wrote the section on its own pick and marked it, so nothing here is final until you say so.</div><ul>${struct?`<li><b>${cur.filter(d=>d.structural).length} structural ${cur.filter(d=>d.structural).length===1?'decision comes':'decisions come'} first.</b> The rest open once Claude has applied them, because changing one rewrites the sections below it.</li>`:''}<li>${nSa} ${nSa===1?'decision':'decisions'} to make and ${nRec} ${nRec===1?'recommendation':'recommendations'} to confirm.</li>${nCl?`<li>${nCl} ${nCl===1?'call':'calls'} Claude made on its own. Reopen any of them.</li>`:''}<li>Disagree with something Claude did not flag? Comment on any section.</li><li>When you are done, press Send to Claude, copy the message and paste it into the chat.</li></ul></div>`}
  h+=SECS.filter(s=>!(FINAL&&s.auto==='claude-calls')).map(s=>`<section class="s" id="sec-${s.id}"><h2>${s.num?`<span class="num">${esc(s.num)}</span>`:''}<span>${esc(s.title)}</span>${!FINAL&&s.rewritten?'<span class="rw">Rewritten after your decisions</span>':''}</h2>${s.auto?auto(s.auto):(s.html||'').replace(/\{\{(D-[\w-]+)\}\}/g,(m,id)=>mark(id))}${cards(s.id)}${comment(s)}</section>`).join('');
  document.getElementById('doc').innerHTML=h}

function jump(id){const el=document.getElementById('dec-'+id);if(!el)return;el.scrollIntoView({block:'start'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
function nextDecision(){const cur=actionable().filter(d=>d.status==='open'&&!lockedBy(d)&&!picks[d.id]);if(cur.length)jump(cur[0].id)}
function message(){const L=[];for(const id in picks){const p=picks[id],d=byId(id);
    if(isKey(d,p.pick))L.push(`${id}: ${p.pick} (${optName(d,p.pick)})${(p.reason||'').trim()?' · why: '+p.reason.trim():''}`);
    else if(p.pick==='ok')L.push(`${id}: confirm`);
    else if(p.pick==='own')L.push(`${id}: ${d.kind==='recommended'?'change':'own answer'}: ${(p.text||'').trim()}`);
    else if(p.pick==='more')L.push(`${id}: need more first: ${(p.text||'').trim()}`);
    else if(p.pick==='reopen')L.push(`Reopen ${id}: ${(p.text||'').trim()||'no reason given'}`)}
  SECS.forEach(s=>{const t=(comments[s.id]||'').trim();if(t)L.push(`Comment on ${secLabel(s)}: ${t}`)});
  return `Decisions for ${DATA.client} · Solution design ${DATA.version}. Write these to the Decisions tab, rewrite the sections they touch, save the next version and tell me what changed.\n`+L.join('\n')}
function showCopy(title,lead,text,warn){const m=document.getElementById('modal'),b=document.getElementById('modal-box');
  b.innerHTML=`<h2 id="modal-h">${esc(title)}</h2><div>${esc(lead)}</div><pre id="msg">${esc(text)}</pre>${warn?`<div class="warn">${esc(warn)}</div>`:''}<div class="acts"><span class="ok" id="copied" role="status"></span><button data-act="close">Keep editing</button><button class="pri" data-act="copy"${warn?' disabled':''}>Copy for Claude</button></div>`;m.hidden=false;const f=b.querySelector('button.pri:not(:disabled)')||b.querySelector('button');f.focus()}
function showSend(){const missing=Object.entries(picks).filter(([id,p])=>(p.pick==='own'||p.pick==='more')&&!(p.text||'').trim()).map(x=>x[0]);
  showCopy('This is what goes to Claude','Copy it and paste it into the chat. Claude writes it into the decision log, rewrites only the sections these touch, and saves the next version of this page.',message(),missing.length?missing.join(', ')+': say what you want or what you need first.':'')}
function showApprove(){showCopy('Approve this draft','Copy it and paste it into the chat. Claude records your approval and accepts the calls it made on its own.',`Approve the ${DATA.client} solution design ${DATA.version}. Accept the calls Claude made with it.`,'')}
function copyMsg(){const t=document.getElementById('msg').textContent,done=()=>{document.getElementById('copied').textContent='Copied. Paste it into the chat with Claude.'};
  const sel=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('msg'));const s=getSelection();s.removeAllRanges();s.addRange(r);document.getElementById('copied').textContent='Select the text above and copy it, then paste it into the chat.'};
  try{navigator.clipboard.writeText(t).then(done,sel)}catch(e){sel()}}

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='pick'){const k=t.dataset.k,cur=picks[id],d=byId(id);if(cur&&cur.pick===k&&!isKey(d,k))delete picks[id];else picks[id]={pick:k,text:'',reason:cur&&isKey(d,k)?cur.reason||'':''};save();render();const f=document.getElementById((k==='more'?'more':k==='reopen'?'ro':'own')+'-'+id);if(f)f.focus()}
  else if(a==='change'){const d=byId(id),k=(d.opts||[]).find(o=>d.chosen&&(o.name===d.chosen||o.k===d.chosen_key));picks[id]={pick:d.kind==='recommended'?'own':(k?k.k:(d.lean||'own')),text:'',reason:''};save();render()}
  else if(a==='cm'){openCm[t.dataset.sec]=1;render();const f=document.getElementById('cm-'+t.dataset.sec);if(f)f.focus()}
  else if(a==='jump')jump(id);
  else if(a==='next')nextDecision();
  else if(a==='send')showSend();
  else if(a==='approve')showApprove();
  else if(a==='copy')copyMsg();
  else if(a==='close')document.getElementById('modal').hidden=true});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;
  if(f==='comment'){comments[t.dataset.sec]=t.value;const b=document.querySelector('#bar [data-act=send]');if(b){const n=pendingCount();b.disabled=!n;b.textContent='Send '+(n||'')+' to Claude'}}
  else if(picks[t.dataset.id])picks[t.dataset.id][f]=t.value;
  save()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').hidden=true});
render();
})();
</script>
</body>
</html>
