<h2 class="sr-only">Where the client stands for this stage: what was found or written, what needs a look, and the next step.</h2>
<style>
.sc-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0.5rem 0 0.25rem}
.sc-grp{font-size:12px;color:var(--text-secondary);margin:1rem 0 4px}
.sc-row{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;padding:8px 2px;border-bottom:0.5px solid var(--border)}
.sc-row i{font-size:18px;line-height:1.3}
.ok{color:var(--text-success)}.miss{color:var(--text-danger)}.warn{color:var(--text-warning)}.none{color:var(--text-muted)}
.sc-l{font-size:14px;font-weight:500}.sc-d{font-size:13px;color:var(--text-secondary);line-height:1.45}
.sc-form{display:grid;gap:12px;margin-top:1.25rem;padding:1rem 1.25rem;border:0.5px solid var(--border);border-radius:12px;background:var(--surface-1)}
.sc-f label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.sc-f small{display:block;font-size:12px;color:var(--text-muted);margin-top:3px}
.tg{display:inline-flex;gap:6px;flex-wrap:wrap}.tg button{font-size:13px;padding:4px 12px;height:auto}
.tg button.on,.sc-go button.on{background:var(--fill-accent)!important;color:var(--on-accent)!important;border-color:var(--fill-accent)!important}
.sc-go{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:1rem}
.fnd{padding:10px 12px;border-radius:var(--radius);background:var(--surface-1);margin-top:6px}
.fnd-t{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:4px}
.fnd-l{font-size:13px;color:var(--text-secondary);line-height:1.6;padding-left:26px}
.fnd-l b{font-weight:500;color:var(--text-primary)}
.na{font-size:12px;color:var(--text-muted);margin-top:8px;line-height:1.5}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.calc{font-size:12px;color:var(--text-secondary);margin-top:4px}
textarea{width:100%;box-sizing:border-box;min-height:64px;font:inherit;font-size:14px}
</style>
<div class="sc-h"><span id="hd" style="font-size:14px;color:var(--text-secondary)"></span><span id="sum" style="font-size:13px;color:var(--text-secondary)"></span></div>
<div id="items"></div>
<div id="form"></div>
<div class="sc-go" id="go"></div>
<script>
var CFG={client:'Harborlight',stage:'D-01 Reverse demo, Tue Nov 17, S-04',sum:'Written into the documents. Review them there.',okTitle:'Updated',badTitle:'Needs your eyes',
items:[
{state:'warn',label:'Conflict on E3.1: who decides outpatient eligibility',detail:'Dr. Elena Marsh (D-01, 00:44:17) against Marcus Whitfield (S-03, 00:19:02). Both quotes are on the row, now in Conflict; nothing was overwritten. Q-57 settles it at D-04.'},
{state:'warn',label:'Beyond SOW: E5.6, text reminders before the first appointment',detail:'Dana Reyes, D-01, 00:51:30. Written as Beyond SOW with its story, Scope decision empty; tell the PM this week.'},
{state:'warn',label:'Suggestion: split D-03 by program',detail:'Four program directors in 90 minutes is tight. D-03 is on the client\'s calendar, so nothing moved; take it to Priya if you agree.'},
{state:'ok',label:'Requirements list',url:'https://docs.google.com/spreadsheets/d/1ZO1dc0bwLSoZ3h_6qRAWOiV7RQIGshfWijZvzZs7cas/edit',detail:'2 new, 1 changed, 1 quote added · 3 stories drafted · Q-01 answered, Q-56 and Q-57 added'},
{state:'ok',label:'Workflow document',url:'https://claude.ai/artifact/B8w4mzARBqm6rfrwyxQvBX',detail:'W-01 Fax referral, today: new, seven steps'},
{state:'ok',label:'What we heard',url:'https://claude.ai/artifact/Wknj94CLTi9YBnMguLSgws',detail:'1 new pain point, 1 number'},
{state:'ok',label:'Discovery plan',url:'https://claude.ai/artifact/TUf1JzdHFWJ1YpLSj2BpWG',detail:'D-01 held; S-03, S-12 and S-22 now known; D-02 agenda revised'}],
form:[],
send:'Fold in my comments on the Harborlight documents.',
button:'Fold in my comments',
alt:[{label:'Draft the client follow-up email',prompt:'Draft the Harborlight follow-up email for D-01.'},{label:'Draft the D-02 agenda for the client',prompt:'Draft the Harborlight D-02 agenda for the client.'}]};
var V={};CFG.form.forEach(function(f){V[f.id]=Array.isArray(f.value)?f.value.slice():f.value});
var IC={ok:'ti-circle-check',miss:'ti-circle-x',warn:'ti-alert-circle',none:'ti-circle-dashed'};
function lab(x){return x.url?'<a href="'+esc(x.url)+'" target="_blank">'+esc(x.label)+'</a>':esc(x.label)}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function items(){var h='',bad=CFG.items.filter(function(x){return x.state==='miss'||x.state==='warn'}),ok=CFG.items.filter(function(x){return x.state==='ok'}),na=CFG.items.filter(function(x){return x.state==='none'});
if(bad.length&&CFG.badTitle)h+='<div class="sc-grp">'+esc(CFG.badTitle)+'</div>';bad.forEach(function(x){h+='<div class="sc-row"><i class="ti '+IC[x.state]+' '+x.state+'" aria-hidden="true"></i><div><div class="sc-l">'+lab(x)+(x.need!==0?'':' <span style="font-size:11px;font-weight:400;color:var(--text-muted)">helps, not needed</span>')+'</div><div class="sc-d">'+esc(x.detail)+'</div></div></div>'});
if(ok.length)h+='<div class="fnd"><div class="fnd-t"><i class="ti ti-circle-check ok" aria-hidden="true" style="font-size:18px"></i>'+esc(CFG.okTitle||'Found')+'</div><div class="fnd-l">'+ok.map(function(x){return '<div><b>'+lab(x)+'</b> · '+esc(x.detail)+'</div>'}).join('')+'</div>'+(na.length?'<div class="na" style="padding-left:26px">'+esc(CFG.naTitle||'Not here, and that\'s fine')+': '+na.map(function(x){return esc(x.detail)}).join('; ')+'.</div>':'')+'</div>';
document.getElementById('items').innerHTML=h;var miss=bad.filter(function(x){return x.state==='miss'&&x.need}).length;
document.getElementById('sum').textContent=CFG.sum?CFG.sum:miss?miss+' needed item'+(miss>1?'s':'')+' missing':'Everything needed is here';}
function form(){if(!CFG.form.length){document.getElementById('form').innerHTML='';return}
var h='<div class="sc-form"><div style="font-size:14px;font-weight:500">'+esc(CFG.formTitle)+'</div>';
var open=false;CFG.form.forEach(function(f,i){if(f.half&&!open){h+='<div class="two">';open=true}h+='<div class="sc-f"><label for="f-'+f.id+'">'+esc(f.label)+'</label>';
if(f.type==='text')h+='<input id="f-'+f.id+'" data-f="'+f.id+'" type="text" value="'+esc(V[f.id])+'">';
if(f.type==='area')h+='<textarea id="f-'+f.id+'" data-f="'+f.id+'">'+esc(V[f.id])+'</textarea>';
if(f.type==='choice')h+='<div class="tg">'+f.options.map(function(o){return '<button data-c="'+f.id+'" data-v="'+esc(o)+'" class="'+(V[f.id]===o?'on':'')+'">'+(V[f.id]===o?'<i class="ti ti-check" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>':'')+esc(o)+'</button>'}).join('')+'</div>';
if(f.type==='days')h+='<div class="tg">'+['Mon','Tue','Wed','Thu','Fri'].map(function(o){var on=V[f.id].indexOf(o)>=0;return '<button data-d="'+f.id+'" data-v="'+o+'" class="'+(on?'on':'')+'">'+(on?'<i class="ti ti-check" aria-hidden="true" style="font-size:13px;margin-right:4px"></i>':'')+o+'</button>'}).join('')+'</div>';
if(f.hint)h+='<small>'+esc(f.hint)+'</small>';if(f.id===CFG.calcAfter)h+='<div class="calc" id="calc"></div>';h+='</div>';if(open&&(!CFG.form[i+1]||!CFG.form[i+1].half||f.half===2)){h+='</div>';open=false}});
document.getElementById('form').innerHTML=h+'</div>';calc();}
function calc(){var el=document.getElementById('calc');if(!el)return;var d=new Date(String(V.kick||'').replace(/^[A-Za-z]+,?\s+/,'')),w=parseInt(V.weeks,10);if(isNaN(d)||!w){el.textContent='';return}var e=new Date(d.getTime()+((w-1)*7+4)*864e5);el.textContent='Ends '+e.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function go(){var h=(CFG.alt||[]).map(function(a,i){return '<button data-alt="'+i+'">'+esc(a.label)+' ↗</button>'}).join('');
h+='<button id="main" class="on">'+esc(CFG.button)+' ↗</button>';document.getElementById('go').innerHTML=h;}
document.getElementById('hd').textContent=CFG.client+' · '+CFG.stage;
document.getElementById('form').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.c){V[b.dataset.c]=b.dataset.v;form()}
if(b.dataset.d){var a=V[b.dataset.d],k=a.indexOf(b.dataset.v);if(k>=0)a.splice(k,1);else a.push(b.dataset.v);a.sort(function(x,y){return ['Mon','Tue','Wed','Thu','Fri'].indexOf(x)-['Mon','Tue','Wed','Thu','Fri'].indexOf(y)});form()}});
document.getElementById('form').addEventListener('input',function(e){var f=e.target.dataset.f;if(f){V[f]=e.target.value;calc()}});
document.getElementById('go').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.alt!=null){sendPrompt(CFG.alt[+b.dataset.alt].prompt);return}
var out=[CFG.send];CFG.form.forEach(function(f){var v=V[f.id];if(Array.isArray(v))v=v.join(' and ');if(v&&String(v).trim())out.push(f.label+': '+String(v).trim())});
sendPrompt(out.join('\n'))});
items();form();go();
</script>
